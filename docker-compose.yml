version: '3.8'

services:
  glanceapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glanceapp-93
    ports:
      - "8000:8000"
    environment:
      - HF_API_TOKEN=${HF_API_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen2.5-72B-Instruct}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
