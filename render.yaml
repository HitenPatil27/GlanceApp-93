services:
  - type: web
    name: glanceapp-93
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen2.5-72B-Instruct
    healthCheckPath: /api/health
    plan: free
